[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-auto-lrc"
version = "2.0.0a0"
description = "Offline-first lyrics-to-audio alignment with LRC output"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "audioread==3.0.1",
  "chardet==5.2.0",
  "cyrtranslit==1.1.1",
  "fasttext-wheel==0.9.2",
  "g2p-en==2.1.0",
  "julius==0.2.7",
  "kroman==1.1",
  "librosa==0.10.1",
  "nltk==3.8.1",
  "numpy==1.26.3",
  "pykakasi==2.2.1",
  "pypinyin==0.50.0",
  "soundfile==0.12.1",
  "torch==2.1.2",
  "torchaudio==2.1.2",
]

[project.optional-dependencies]
vocals = ["demucs==4.0.1"]

[project.scripts]
ai-auto-lrc = "t2l.adapters.cli:main"

[dependency-groups]
test = [
  "packaging>=23.2,<26",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "tomli>=2,<3; python_version < '3.11'",
]
dev = [
  { include-group = "test" },
  "build>=1.2,<2",
  "ruff>=0.9,<1",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }
torchaudio = { index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["t2l*"]

[tool.setuptools.package-data]
t2l = ["_assets/*.json"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
xfail_strict = true
testpaths = ["tests"]
markers = [
  "component: requires local component assets or codecs",
  "golden: requires the pinned canonical oracle environment",
  "package: builds or inspects an installed distribution",
  "system: requires POSIX process, signal, and filesystem semantics",
]

[tool.coverage.run]
source = ["t2l"]
omit = ["*/t2l/mtl/*"]

[tool.coverage.report]
fail_under = 80
omit = ["*/t2l/mtl/*"]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["B", "BLE", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"t2l/mtl/model.py" = ["ALL"]
"t2l/mtl/utils.py" = ["ALL"]
"t2l/adapters/cli.py" = ["BLE001"]
"t2l/api.py" = ["B008"]
"t2l/application/align_lyrics.py" = ["B008"]
"t2l/phonetic.py" = ["RUF002", "RUF003"]
